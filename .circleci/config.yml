version: 2.1

jobs:
  confindr:
    docker:
      - image: continuumio/miniconda3
    steps:
      - checkout
      - run:
          name: Setup Environment and Run Tests
          no_output_timeout: 30m
          command: |
            set -euo pipefail

            # Install system dependencies
            apt-get update && apt-get install -y curl

            # Configure conda
            conda config --set always_yes yes --set changeps1 no
            conda config --set channel_priority strict

            # Install mamba from conda-forge only
            conda install -n base -c conda-forge --override-channels mamba

            # Create environment in one solve
            mamba create -n confindr -y \
              -c conda-forge \
              -c bioconda \
              --override-channels \
              python=3.12 \
              bbmap \
              biopython \
              blast \
              coloredlogs \
              kma \
              minimap2 \
              psutil \
              pysam \
              pytest \
              pytest-cov \
              rauth \
              samtools \
              scipy

            # Activate environment
            source /opt/conda/etc/profile.d/conda.sh
            conda activate confindr

            # Install confindr in editable mode
            pip install -e .

            # Download test samples with retries
            /usr/bin/curl -L \
              --silent \
              --show-error \
              --retry 6 \
              --retry-delay 5 \
              --retry-connrefused \
              --retry-all-errors \
              --connect-timeout 30 \
              --fail \
              --user-agent 'Mozilla/5.0 (X11; Linux x86_64)' \
              --referer 'https://figshare.com' \
              'https://figshare.com/ndownloader/files/41228577' \
              -o test_samples.tar.gz

            test -s test_samples.tar.gz || {
              echo "Download failed or file empty"
              exit 1
            }

            tar -xzvf test_samples.tar.gz
            mv test_samples/ tests/
            rm test_samples.tar.gz

            # Run tests
            python -m pytest tests/ -vvv

workflows:
  build_and_test:
    jobs:
      - confindr:
          filters:
            branches:
              ignore: gh-pages