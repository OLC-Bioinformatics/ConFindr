version: 2.1

# orbs:
#   python: circleci/python@1.5.0

jobs:
  confindr:
    docker:
      - image: continuumio/miniconda3
    steps:
      - checkout
      - run:
          name: Setup Environment and Run Tests
          command: |
            # Set bash options for safety
            set -euo pipefail
            # Install curl and gnupg
            apt-get update && apt-get install -y curl gnupg
            # Add necessary channels for conda
            conda config --add channels bioconda
            conda config --add channels conda-forge
            # Set conda configuration options
            conda config --set always_yes yes --set changeps1 no
            conda config --set channel_priority strict
            # Install mamba
            conda install mamba -c conda-forge
            # Create a new conda environment
            mamba create -n confindr python=3.13 -y
            # Activate the conda environment
            source /opt/conda/etc/profile.d/conda.sh && conda activate confindr
            # Install dependencies
            mamba install -y -c bioconda -c conda-forge \
              bbmap \
              biopython \
              blast \
              coloredlogs \
              kma \
              minimap2 \
              psutil \
              pysam \
              pytest \
              rauth \
              samtools \
              scipy
            # Install confindr in editable mode
            pip install -e .
            # Download test samples with retries
            /usr/bin/curl -L \
              --silent \
              --show-error \
              --retry 6 \
              --retry-delay 5 \
              --retry-connrefused \
              --retry-all-errors \
              --connect-timeout 30 \
              --fail \
              --user-agent 'Mozilla/5.0 (X11; Linux x86_64)' \
              --referer 'https://figshare.com' \
              'https://figshare.com/ndownloader/files/41228577' \
              -o test_samples.tar.gz

            test -s test_samples.tar.gz || {
              echo "Download failed or file empty"
              exit 1
            }

            tar -xzvf test_samples.tar.gz
            mv test_samples/ tests/
            rm test_samples.tar.gz
            # Run tests
            python -m pytest tests/ -vvv
workflows:
    build_and_test:
      jobs:
        - confindr:
            filters:
              branches:
                ignore: gh-pages