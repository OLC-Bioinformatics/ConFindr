version: 2.1

# orbs:
#   python: circleci/python@1.5.0

jobs:
  confindr:
    docker:
      - image: ubuntu:22.04
    steps:
      - checkout
      - run:
          name: Setup Environment and Run Tests
          command: |
            apt update
            apt install -y wget coreutils curl gnupg
            wget -O Miniforge3.sh  "https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-$(uname)-$(uname -m).sh"
            bash Miniforge3.sh -b -p "${HOME}/conda"
            source "${HOME}/conda/etc/profile.d/conda.sh"
            source "${HOME}/conda/etc/profile.d/mamba.sh"
            conda config --add channels bioconda
            conda config --set always_yes yes --set changeps1 no
            conda activate
            mamba create -n confindr bioconda::confindr=0.8.2
            source activate confindr
            wget --retry-connrefused --waitretry=5 --tries=6 --timeout=30 \
              --user-agent='Mozilla/5.0 (X11; Linux x86_64)' \
              --referer='https://figshare.com' \
              'https://figshare.com/ndownloader/files/41228577' -O test_samples.tar.gz && \
              [ -s test_samples.tar.gz ] || { echo "Download failed or file empty"; exit 1; } && \
              tar -xzvf test_samples.tar.gz && \
              mv test_samples/ tests/ && \
              rm test_samples.tar.gz
            python -m pytest tests/ -vvv
workflows:
    build_and_test:
      jobs:
        - confindr:
            filters:
              branches:
                ignore: gh-pages